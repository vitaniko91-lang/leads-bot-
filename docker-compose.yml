services:
  bot:
    build: .
    container_name: leads-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./sessions:/app/sessions
    working_dir: /app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sqlite3; sqlite3.connect('/app/data/bot.db').execute('SELECT 1')"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard-api:
    build: .
    container_name: leads-dashboard-api
    restart: always
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    working_dir: /app
    command: ["python", "-m", "leads_bot.dashboard.main"]
    expose:
      - "8000"
    depends_on:
      - bot
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard-ui:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
    container_name: leads-dashboard-ui
    restart: always
    environment:
      - NODE_ENV=production
      - DASHBOARD_API_BASE_URL=http://dashboard-api:8000
    expose:
      - "3000"
    depends_on:
      - dashboard-api

  caddy:
    image: caddy:2.8-alpine
    container_name: leads-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard-api
      - dashboard-ui

volumes:
  caddy_data:
  caddy_config:
