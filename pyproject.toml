[project]
name = "leads-bot"
version = "0.1.0"
description = "Telegram userbot for finding freelance design leads"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telethon==1.36.0",
    "aiogram==3.13.1",
    "anthropic==0.39.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "loguru==0.7.2",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-vcr==1.0.2",
    "pytest-mock==3.14.0",
    "ruff==0.7.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
