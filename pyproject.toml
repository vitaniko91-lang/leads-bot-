[project]
name = "leads-bot"
version = "0.1.0"
description = "Telegram userbot for finding freelance design leads"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telethon==1.36.0",
    "aiogram==3.13.1",
    "anthropic==0.39.0",
    "sqlalchemy[asyncio]==2.0.36",
    "greenlet>=3.0",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "loguru==0.7.2",
    "python-dotenv==1.0.1",
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "sse-starlette==2.1.3",
    "apscheduler==3.10.4",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-vcr==1.0.2",
    "pytest-mock==3.14.0",
    "ruff==0.7.4",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/leads_bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
